summary: Patroni + etcd bootstrap to a running Leader

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  ok=0
  for _ in $(seq 180); do
    if [ -S /var/snap/percona-distribution-postgresql/current/run/.s.PGSQL.5432 ]; then
      ok=1
      break
    fi
    echo "Waiting for postgres socket"
    sleep 1
  done
  if [ "$ok" != 1 ]; then
    echo "postgres socket never appeared; service state and logs follow"
    snap services percona-distribution-postgresql || :
    snap logs percona-distribution-postgresql -n 100 || :
    exit 1
  fi

execute: |
  SNAP_CUR=/snap/percona-distribution-postgresql/current
  ETC=/var/snap/percona-distribution-postgresql/current/etc

  # Patroni manages its OWN scratch cluster (patroni.yml: data_dir under
  # common/patroni-data, port 5433) and is not meant to run against the
  # same data directory as the main postgresql daemon -- stop it first.
  echo "Stopping the main postgresql daemon"
  snap stop percona-distribution-postgresql.postgresql

  echo "Starting etcd"
  snap start percona-distribution-postgresql.etcd
  ok=0
  for _ in $(seq 30); do
    curl -s http://127.0.0.1:2379/health | grep -q '"health":"true"' && { ok=1; break; }
    sleep 2
  done
  if [ "$ok" != 1 ]; then
    echo "=== FORENSICS: etcd health check failed ==="
    snap logs percona-distribution-postgresql.etcd -n 50 || true
    ss -ltn | grep 2379 || true
  fi
  [ "$ok" = 1 ]

  echo "Starting patroni"
  snap start percona-distribution-postgresql.patroni

  # patronictl runs as its own snap app so it uses the snap's python --
  # a host interpreter pointed at the snap's site tree cannot import the
  # C extensions (psycopg2 is built for core26's 3.13; CI-proven
  # "No module named 'psycopg'" on the noble VM's 3.12).
  PATRONICTL="percona-distribution-postgresql.patronictl"

  echo "Waiting for a Leader"
  ok=0
  for _ in $(seq 60); do
    if "${PATRONICTL}" -c "${ETC}/patroni.yml" list 2>/dev/null | grep -q "Leader"; then
      ok=1
      break
    fi
    sleep 2
  done
  if [ "$ok" != 1 ]; then
    echo "=== FORENSICS: patroni did not reach Leader ==="
    "${PATRONICTL}" -c "${ETC}/patroni.yml" list || true
    echo "--- patroni log tail ---"
    snap logs percona-distribution-postgresql.patroni -n 80 || true
    echo "--- etcd log tail ---"
    snap logs percona-distribution-postgresql.etcd -n 50 || true
  fi
  [ "$ok" = 1 ]

  echo "Leader is actually serving queries (patroni.yml: superuser snap_daemon, TCP scram)"
  PGPASSWORD='superuser-change-me' timeout 5 percona-distribution-postgresql.psql \
    -h 127.0.0.1 -p 5433 -U snap_daemon -d postgres -tAc "SELECT 1;" | grep -q '^1$'

restore: |
  timeout 60 snap stop percona-distribution-postgresql.patroni || true
  # Task 5's report: patroni's own control-plane process does not exit
  # promptly on SIGTERM (20+ seconds of no further log activity under
  # direct-exec, needed kill -9 to reap) -- fall back to a hard kill so
  # this restore never blocks on the daemon's own stop handling.
  pkill -9 -f "/usr/bin/patroni" || true
  snap stop percona-distribution-postgresql.etcd || true
  snap remove percona-distribution-postgresql --purge --terminate || true
