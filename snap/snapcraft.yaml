    override-prime: |
      craftctl default
      # percona-postgresql-17-postgis-3-scripts (transitively staged via
      # -postgis-3's Depends, dpkg-evidenced) ships its .control files
      # ONLY under the major-version-suffixed names (postgis-3.control,
      # postgis_raster-3.control, ...) plus a postinst `update-alternatives`
      # call that symlinks the plain names (postgis.control, ...) to them
      # -- the exact same postinst-only-symlink class of bug as the
      # pg_wrapper /usr/bin/psql finding (Task 4), which snapcraft's raw
      # deb staging never runs. Without this, `CREATE EXTENSION postgis`
      # fails with "extension \"postgis\" is not available" even though
      # every .so and every postgis--*.sql install/upgrade script is
      # present. Recreated by hand, matching the postinst's own
      # `update-alternatives --install ... --slave ...` targets exactly
      # (dpkg -e'd and read verbatim from the LIVE ppg-17 deb's own
      # postinst script -- re-verified for this track, not assumed from
      # 18: byte-identical mapping, only the PGVERSION directory prefix
      # differs, 17 not 18).
      ln -sf postgis-3.control usr/share/postgresql/17/extension/postgis.control
      ln -sf postgis_raster-3.control usr/share/postgresql/17/extension/postgis_raster.control
      ln -sf postgis_sfcgal-3.control usr/share/postgresql/17/extension/postgis_sfcgal.control
      ln -sf postgis_tiger_geocoder-3.control usr/share/postgresql/17/extension/postgis_tiger_geocoder.control
      ln -sf postgis_topology-3.control usr/share/postgresql/17/extension/postgis_topology.control
      ln -sf address_standardizer-3.control usr/share/postgresql/17/extension/address_standardizer.control
      ln -sf address_standardizer_data_us-3.control usr/share/postgresql/17/extension/address_standardizer_data_us.control
