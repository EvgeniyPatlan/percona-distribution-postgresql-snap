name: percona-distribution-postgresql
base: core26
version: '17.11-1'
summary: Percona Distribution for PostgreSQL 17 in a snap.
description: |
  Percona Distribution for PostgreSQL packages PostgreSQL 17 together with
  every extension, backup/pooling tool, and HA component Percona ships:
  pg_tde (transparent data encryption), pg_stat_monitor, pgAudit (+
  set_user), pgvector, pg_cron, pg_repack, wal2json, pgBackRest, PgBouncer,
  pgBadger, pg_gather, Patroni, etcd, HAProxy, Pgpool-II, and PostGIS plus
  the PL/Perl, PL/Python3, and PL/Tcl procedural languages.

  On install the snap initializes the data directory (initdb) and starts
  postgres. The superuser role IS the snap's own system user, snap_daemon:
  every client command in this snap (psql, pg-dump, ...) drops privileges
  to snap_daemon before connecting over the local Unix socket, and peer
  authentication on that socket makes it the postgres superuser with NO
  PASSWORD. Connect immediately with:
    sudo percona-distribution-postgresql.psql
  Host (TCP, 127.0.0.1) connections are NOT covered by peer auth — they
  need an explicitly created role with a scram-sha-256 password; see
  pg_hba.conf.

  Shell-redirecting a client command's stdout needs `| cat` appended (snap
  confinement leaves stdout as a non-standard fd otherwise), e.g.:
    sudo percona-distribution-postgresql.pg-dump postgres | cat > backup.sql
  Input files for client commands (COPY FROM, pgBackRest repos, log files
  for pgbadger, ...) must live under
  /var/snap/percona-distribution-postgresql/common — the snap cannot read
  your home directory.

  Preloaded on every start (shared_preload_libraries): pg_tde,
  pg_stat_monitor, pgaudit, pg_cron. Everything else in the core/extension
  set is a plain `CREATE EXTENSION vector|postgis|pg_repack|pgaudit|
  set_user|...` once connected. wal2json is the one exception: it ships as
  a logical-decoding OUTPUT PLUGIN, not an extension — select it via
  `pg_recvlogical --plugin=wal2json` or
  `pg_create_logical_replication_slot('slot', 'wal2json')`.
  pg_tde additionally needs a key provider AND a principal key configured
  before `CREATE TABLE ... USING tde_heap` will work:
    SELECT pg_tde_add_global_key_provider_file('file-keyring',
      '/var/snap/percona-distribution-postgresql/common/pg_tde_keyring/keyring');
    SELECT pg_tde_create_key_using_global_key_provider('principal-key', 'file-keyring');
    SELECT pg_tde_set_key_using_global_key_provider('principal-key', 'file-keyring');
  See Percona's pg_tde documentation before using this for production data
  — a file keyring is a starting point, not a production keyring.

  Optional services (disabled by default, start with `snap start`):
    .pgbouncer — connection pooler; listens on 127.0.0.1:6432; config at
      .../current/etc/pgbouncer.ini; auth_file starts empty at
      .../current/etc/pgbouncer-userlist.txt — add scram roles before use.
    .patroni + .etcd — Patroni manages ITS OWN postgres cluster (a scratch
      cluster under .../common/patroni-data, listening on 127.0.0.1:5433),
      backed by a single-node etcd on 127.0.0.1:2379 (peers on :2380).
      STOP `.postgresql` first — Patroni and the main daemon are not meant
      to run against the same data directory. Patroni's REST API is on
      127.0.0.1:8008; config at .../current/etc/patroni.yml and
      .../current/etc/etcd.conf.yml.
    .haproxy — TCP-mode load balancer; config at
      .../current/etc/haproxy.cfg (no frontend/backend enabled by default
      — uncomment the example, which points at this snap's own postgres).
    .pgpool — connection pooling/load balancing; listens on 127.0.0.1:9999
      (PCP admin on :9898); config at .../current/etc/pgpool.conf, wired
      to this snap's own postgres on 5432 by default. Needs sr_check_user/
      health_check_user and a pool_passwd entry (usr/sbin/pg_enc, not
      pg_md5 — backend needs scram) before it proxies, keyed with
      .../common/pgpool.key (also the daemon's own key); see pgpool.conf.

  Ops CLIs: pgbackrest (config at .../current/etc/pgbackrest.conf, repo
  under .../common/pgbackrest), pgbadger (point it at a log file under
  .../common/log), pg-gather (runs Percona's gather.sql diagnostic script
  against this snap's own postgres via psql).

  Tracks: 17/edge (PostgreSQL 17, this build) and 18/edge (PostgreSQL 18).
title: Percona Distribution for PostgreSQL
contact: https://github.com/EvgeniyPatlan/percona-distribution-postgresql-snap/issues
issues: https://github.com/EvgeniyPatlan/percona-distribution-postgresql-snap/issues
source-code: https://github.com/EvgeniyPatlan/percona-distribution-postgresql-snap
website: https://www.percona.com/postgresql/software/percona-distribution-for-postgresql

grade: stable
confinement: strict
license: Apache-2.0
platforms:
  amd64:
  arm64:

system-usernames:
  snap_daemon: shared

package-repositories:
  - type: apt
    url: https://repo.percona.com/ppg-17/apt
    suites: [resolute]
    components: [main]
    key-id: 4D1BB29D63D98E422B2113B19334A25F8507EFA5

hooks:
  # initdb is local-only (no networking); the install hook needs no plugs
  # at all (valkey-lesson consistency — see the family's binding §9 list).
  install: {}
  configure: {}

apps:
  postgresql:
    command: bin/postgresql.sh
    daemon: simple
    stop-timeout: 5m
    environment:
      PGBACKREST_CONFIG: $SNAP_DATA/etc/pgbackrest.conf
    plugs:
      - network
      - network-bind
  pgbouncer:
    command: bin/pgbouncer.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  patroni:
    command: bin/patroni.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  etcd:
    command: bin/etcd.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  haproxy:
    command: bin/haproxy.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  pgpool:
    command: bin/pgpool.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  psql:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/psql
    plugs:
      - network
  pg-dump:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/pg_dump
    plugs:
      - network
  pg-dumpall:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/pg_dumpall
    plugs:
      - network
  pg-restore:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/pg_restore
    plugs:
      - network
  pg-basebackup:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/pg_basebackup
    plugs:
      - network
  pgbench:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/pgbench
    plugs:
      - network
  createdb:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/createdb
    plugs:
      - network
  dropdb:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/dropdb
    plugs:
      - network
  createuser:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/createuser
    plugs:
      - network
  dropuser:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/dropuser
    plugs:
      - network
  pg-isready:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/pg_isready
    plugs:
      - network
  vacuumdb:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/vacuumdb
    plugs:
      - network
  reindexdb:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/reindexdb
    plugs:
      - network
  clusterdb:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/clusterdb
    plugs:
      - network
  pg-repack:
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/pg_repack
    plugs:
      - network
  pgbackrest:
    command: bin/drop_priv.sh $SNAP/usr/bin/pgbackrest
    environment:
      # Default config so pgbackrest works without --config (mirrors
      # charmed-postgresql-snap's pgbackrest app).
      PGBACKREST_CONFIG: $SNAP_DATA/etc/pgbackrest.conf
    plugs:
      - network
  pgbadger:
    command: bin/drop_priv.sh $SNAP/usr/bin/pgbadger
    plugs:
      - network
  pg-gather:
    # percona-pg-gather ships NO binary — only a diagnostic SQL script
    # (usr/share/postgresql/17/contrib/gather.sql, dpkg-verified). Run it
    # against this snap's own postgres via psql -f; trailing args (e.g. a
    # different -d dbname) are still accepted after the script path.
    command: bin/drop_priv.sh $SNAP/usr/lib/postgresql/17/bin/psql -f $SNAP/usr/share/postgresql/17/contrib/gather.sql
    plugs:
      - network

parts:
  packages-deb:
    plugin: nil
    stage-packages:
      # Core
      - percona-postgresql-17=2:17.11-1.resolute
      - percona-postgresql-client-17=2:17.11-1.resolute
      - percona-postgresql-common=1:293-1.resolute
      - percona-postgresql-contrib=1:293-1.resolute
      # NO percona-postgresql-17-jit pin: unlike 18, the ppg-17 resolute
      # index ships no such package at all (live-verified 2026-08-25 --
      # zero "jit"/"llvm" hits anywhere in the index). JIT is instead
      # BUILT INTO the core percona-postgresql-17 package itself, which
      # Provides: postgresql-17-jit-llvm (= 21) -- a genuine structural
      # difference from 18 (separate package there), not a missing
      # feature: `SHOW jit;` / JIT-compiled plans work with no extra pin.
      # Extensions
      - percona-pg-tde17=1:2.2.2-1.resolute
      # percona-pg-tde17 is ALSO now a hard Depends of core
      # percona-postgresql-17 itself (live-verified) -- unlike 18, where
      # pg-tde18 is not in postgresql-18's Depends and is pulled in only
      # by this explicit pin. Pinned explicitly anyway per the family's
      # exact-pins-even-for-transitive-deps lesson.
      - percona-pg-stat-monitor17=1:2.3.2-3.resolute
      - percona-postgresql-17-pgaudit=1:17.1-4.resolute
      - percona-pgaudit17-set-user=1:4.2.0-6.resolute
      - percona-postgresql-17-pgvector=1:0.8.6-1.resolute
      - percona-postgresql-17-cron=1:1.6.7-2.resolute
      - percona-postgresql-17-repack=1:1.5.3-5.resolute
      - percona-postgresql-17-wal2json=1:2.6-4.resolute
      # Ops (backup / pooling / analysis) -- these four are NOT PG-major-
      # version-tied packages; pgbackrest/pgbouncer/pgbadger's ppg-17
      # versions are byte-identical to ppg-18's (live-verified). pg-gather
      # DOES differ (Depends: percona-postgresql-17 specifically, so its
      # own build/version cadence tracks the PG-17 repo, not 18's).
      - percona-pgbackrest=1:2.59.0-1.resolute
      - percona-pgbouncer=1:1.25.2-2.resolute
      - percona-pgbadger=1:13.2-3.resolute
      - percona-pg-gather=1:33-2.resolute
      # HA stack -- also not PG-major-version-tied; all four ppg-17
      # versions are byte-identical to ppg-18's (live-verified).
      - percona-patroni=1:4.1.5-1.resolute
      - etcd=1:3.5.33-1.resolute
      - percona-haproxy=2:2.8.27-1.resolute
      - percona-pgpool2=1:4.7.2-2.resolute
      # Heavy: PostGIS + PL languages
      - percona-postgresql-17-postgis-3=2:3.5.7-2.resolute
      # -postgis-3 ships only .so + major-version-suffixed .control
      # stubs; -scripts ships the actual postgis--*.sql install/upgrade
      # scripts AND the same .control files (transitively pulled by
      # -postgis-3's Depends either way, dpkg-evidenced -- re-verified
      # directly against the live ppg-17 deb's own postinst script, byte-
      # identical update-alternatives mapping to 18's, just under
      # /usr/share/postgresql/17/extension/ instead of /18/). Staged
      # explicitly, matching Task 5's proof that it's load-bearing (see
      # the packages-deb part's override-prime for the matching
      # postinst-symlink fix `CREATE EXTENSION postgis` needs).
      - percona-postgresql-17-postgis-3-scripts=2:3.5.7-2.resolute
      - percona-postgresql-plperl-17=2:17.11-1.resolute
      - percona-postgresql-plpython3-17=2:17.11-1.resolute
      - percona-postgresql-pltcl-17=2:17.11-1.resolute
      # From the base Ubuntu archive, not repo.percona.com (unpinned, like
      # the rest of the family's util-linux staging):
      #   - util-linux: ships /usr/bin/setpriv, used by every wrapper.
      #   - python3: percona-patroni's own Depends (python3-click, ...,
      #     python3:any) pull the interpreter in transitively already;
      #     staged explicitly anyway, mirroring the family's toolkit-perl
      #     precedent of not relying on a transitive pull for a runtime
      #     the snap directly execs (patroni.sh; see also pg_repack /
      #     other tools potentially needing it).
      #   - perl: percona-pgbadger's Depends (perl:any) and plperl's
      #     libperl5.40 dependency chain would pull it in too; staged
      #     explicitly for the same reason (pgbadger is a perl script).
      #   - tcl8.6: pltcl only needs libtcl8.6 (already a transitive
      #     Depends) to dlopen pltcl.so — no snap app execs tclsh — but
      #     staged explicitly per the same defensive precedent.
      - util-linux
      - python3
      - perl
      - tcl8.6
    organize:
      # --- Collision relocations: postgresql-common and every other deb
      # in this stage-packages list that ships its OWN /etc payload. This
      # snap's authoritative configs are the snap-scripts templates below
      # (seeded into $SNAP_DATA/etc/... by the install hook); the debs'
      # packaged copies are moved aside as inert operator reference
      # material rather than left live in $SNAP/etc (the mysqld-includedir
      # class of live-scanned /etc does not exist in this family member).
      etc/postgresql-common/pg_upgradecluster.d/analyze: usr/share/percona-postgresql-common/pg_upgradecluster.d/analyze.default
      etc/etcd/etcd.conf.yaml: usr/share/etcd-server/etcd.conf.yaml.default
      etc/haproxy/haproxy.cfg: usr/share/percona-haproxy/haproxy.cfg.default
      etc/haproxy/errors: usr/share/percona-haproxy/errors.default
      etc/patroni/patroni.yml.sample: usr/share/percona-patroni/patroni.yml.sample.default
      etc/pgbackrest.conf: usr/share/percona-pgbackrest/pgbackrest.conf.default
      etc/pgbouncer/pgbouncer.ini: usr/share/percona-pgbouncer/pgbouncer.ini.default
      etc/pgbouncer/userlist.txt: usr/share/percona-pgbouncer/userlist.txt.default
      etc/pgpool2/pcp.conf: usr/share/percona-pgpool2/pcp.conf.default
      etc/pgpool2/pool_hba.conf: usr/share/percona-pgpool2/pool_hba.conf.default
      etc/pgpool2/pool_passwd: usr/share/percona-pgpool2/pool_passwd.default
      # --- Copyright relocations (dpkg-verified per package; two staged
      # debs ship none at all — percona-pg-gather and percona-pg-tde17,
      # each only carries usr/share/doc/<pkg>/changelog.Debian.gz [+
      # README.md for pg_tde] — nothing to relocate for those two; both
      # re-verified directly against the live ppg-17 debs, not just
      # assumed from the 18-side finding). No percona-postgresql-17-jit
      # entry: that package does not exist on 17 (see the stage-packages
      # comment above) — its copyright text is covered by
      # percona-postgresql-17's own COPYRIGHT below, since JIT is part of
      # that package here.
      usr/share/doc/percona-postgresql-17/copyright: licenses/COPYRIGHT-percona-postgresql-17
      usr/share/doc/percona-postgresql-client-17/copyright: licenses/COPYRIGHT-percona-postgresql-client-17
      usr/share/doc/percona-postgresql-plperl-17/copyright: licenses/COPYRIGHT-percona-postgresql-plperl-17
      usr/share/doc/percona-postgresql-plpython3-17/copyright: licenses/COPYRIGHT-percona-postgresql-plpython3-17
      usr/share/doc/percona-postgresql-pltcl-17/copyright: licenses/COPYRIGHT-percona-postgresql-pltcl-17
      usr/share/doc/percona-postgresql-common/copyright: licenses/COPYRIGHT-percona-postgresql-common
      usr/share/doc/postgresql-common/copyright: licenses/COPYRIGHT-postgresql-common
      usr/share/doc/percona-postgresql-contrib/copyright: licenses/COPYRIGHT-percona-postgresql-contrib
      usr/share/doc/percona-postgresql-17-cron/copyright: licenses/COPYRIGHT-percona-postgresql-17-cron
      usr/share/doc/percona-postgresql-17-pgaudit/copyright: licenses/COPYRIGHT-percona-postgresql-17-pgaudit
      usr/share/doc/percona-pgaudit17-set-user/copyright: licenses/COPYRIGHT-percona-pgaudit17-set-user
      usr/share/doc/percona-postgresql-17-pgvector/copyright: licenses/COPYRIGHT-percona-postgresql-17-pgvector
      usr/share/doc/percona-postgresql-17-postgis-3/copyright: licenses/COPYRIGHT-percona-postgresql-17-postgis-3
      usr/share/doc/percona-postgresql-17-postgis-3-scripts/copyright: licenses/COPYRIGHT-percona-postgresql-17-postgis-3-scripts
      usr/share/doc/percona-postgresql-17-repack/copyright: licenses/COPYRIGHT-percona-postgresql-17-repack
      usr/share/doc/percona-postgresql-17-wal2json/copyright: licenses/COPYRIGHT-percona-postgresql-17-wal2json
      usr/share/doc/percona-pgbackrest/copyright: licenses/COPYRIGHT-percona-pgbackrest
      usr/share/doc/percona-pgbouncer/copyright: licenses/COPYRIGHT-percona-pgbouncer
      usr/share/doc/percona-pgbadger/copyright: licenses/COPYRIGHT-percona-pgbadger
      usr/share/doc/percona-pgpool2/copyright: licenses/COPYRIGHT-percona-pgpool2
      usr/share/doc/libpgpoolpcp3/copyright: licenses/COPYRIGHT-libpgpoolpcp3
      usr/share/doc/percona-haproxy/copyright: licenses/COPYRIGHT-percona-haproxy
      usr/share/doc/percona-patroni/copyright: licenses/COPYRIGHT-percona-patroni
      usr/share/doc/etcd/copyright: licenses/COPYRIGHT-etcd
      usr/share/doc/etcd-client/copyright: licenses/COPYRIGHT-etcd-client
      usr/share/doc/etcd-server/copyright: licenses/COPYRIGHT-etcd-server
      usr/share/doc/util-linux/copyright: licenses/COPYRIGHT-util-linux
      usr/share/doc/python3/copyright: licenses/COPYRIGHT-python3
      usr/share/doc/perl/copyright: licenses/COPYRIGHT-perl
      usr/share/doc/tcl8.6/copyright: licenses/COPYRIGHT-tcl8.6
    prime:
      # Host-only integration noise (init scripts, sysvinit env files,
      # logrotate/rsyslog/PAM/systemd hookups, man pages, lintian
      # overrides) that makes no sense inside a snap. perl's
      # etc/perl/Net/libnet.cfg (Net::Config defaults for FTP-family
      # modules) is dropped too — nothing in this snap uses those
      # protocols.
      - -etc/init.d
      - -etc/default
      - -etc/logrotate.d
      - -etc/rsyslog.d
      - -etc/pam.d
      - -etc/perl
      - -lib/systemd
      - -usr/lib/systemd
      - -usr/lib/tmpfiles.d
      - -usr/share/man
      - -usr/share/lintian
      # Now-empty directories left behind once the files inside them were
      # organized out above (postgresql-common's /etc/postgresql is an
      # empty stub to begin with — this snap bypasses pg_wrapper/
      # pg_createcluster entirely, see snap/local/etc/postgresql.conf).
      - -etc/postgresql
      - -etc/postgresql-common
      - -etc/haproxy
      - -etc/patroni
      - -etc/pgbouncer
      - -etc/pgpool2
      - -etc/etcd
      # Mute lint: unused libraries (real `snapcraft pack` build output,
      # this repo's real baseline — see task-5-report.md). Verified via
      # `grep -rl <libname>` across the primed usr/bin/usr/sbin/usr/lib
      # tree for zero dlopen-style string references before adding each
      # one; the handful with hits (libfreeblpriv3/libnssckbi/libnssdbm3/
      # libsoftokn3/libpthread) are only referenced by other members of
      # this same excluded NSS-crypto cluster or by glibc-internal
      # consumers (libc.so.6, ldconfig) — the same libnss_*/libpthread/
      # librt/libutil/libdl/libanl/libBrokenLocale/libnss_compat glibc
      # compat-stub cluster every sibling repo in this family already
      # excludes with no functional impact on getpwnam/setpriv lookups.
      - -usr/lib/*/libBrokenLocale.so*
      - -usr/lib/*/libabsl_civil_time.so*
      - -usr/lib/*/libabsl_cordz_sample_token.so*
      - -usr/lib/*/libabsl_crc_cpu_detect.so*
      - -usr/lib/*/libabsl_die_if_null.so*
      - -usr/lib/*/libabsl_failure_signal_handler.so*
      - -usr/lib/*/libabsl_flags_marshalling.so*
      - -usr/lib/*/libabsl_flags_parse.so*
      - -usr/lib/*/libabsl_flags_usage.so*
      - -usr/lib/*/libabsl_flags_usage_internal.so*
      - -usr/lib/*/libabsl_generic_printer_internal.so*
      - -usr/lib/*/libabsl_hashtable_profiler.so*
      - -usr/lib/*/libabsl_log_entry.so*
      - -usr/lib/*/libabsl_log_flags.so*
      - -usr/lib/*/libabsl_log_initialize.so*
      - -usr/lib/*/libabsl_log_internal_check_op.so*
      - -usr/lib/*/libabsl_log_internal_conditions.so*
      - -usr/lib/*/libabsl_log_internal_message.so*
      - -usr/lib/*/libabsl_log_severity.so*
      - -usr/lib/*/libabsl_periodic_sampler.so*
      - -usr/lib/*/libabsl_poison.so*
      - -usr/lib/*/libabsl_profile_builder.so*
      - -usr/lib/*/libabsl_random_distributions.so*
      - -usr/lib/*/libabsl_random_internal_distribution_test_util.so*
      - -usr/lib/*/libabsl_random_internal_entropy_pool.so*
      - -usr/lib/*/libabsl_random_seed_sequences.so*
      - -usr/lib/*/libabsl_scoped_set_env.so*
      - -usr/lib/*/libabsl_status.so*
      - -usr/lib/*/libabsl_statusor.so*
      - -usr/lib/*/libabsl_vlog_config_internal.so*
      - -usr/lib/*/libanl.so*
      - -usr/lib/*/libboost_wserialization.so*
      - -usr/lib/*/libc_malloc_debug.so*
      - -usr/lib/*/libdl.so*
      - -usr/lib/*/libdrop_ambient.so*
      - -usr/lib/*/libexpatw.so*
      - -usr/lib/*/libexslt.so*
      - -usr/lib/*/libformw.so*
      - -usr/lib/*/libfreebl3.so*
      - -usr/lib/*/libfreeblpriv3.so*
      - -usr/lib/*/libhistory.so*
      - -usr/lib/*/libhwy_contrib.so*
      - -usr/lib/*/libhwy_test.so*
      - -usr/lib/*/libicuio.so*
      - -usr/lib/*/libicutest.so*
      - -usr/lib/*/libicutu.so*
