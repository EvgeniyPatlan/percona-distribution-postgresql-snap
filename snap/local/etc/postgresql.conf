# PostgreSQL configuration for the _NAME_ snap.
# This file is seeded to /var/snap/_NAME_/current/etc/postgresql/postgresql.conf
# on install; edit it there and restart with:
#   sudo snap restart _NAME_.postgresql
# ALTER SYSTEM also works: it rewrites postgresql.auto.conf inside the
# (snap_daemon-owned) data directory, which this file still includes.

listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/var/snap/_NAME_/current/run'

# Preloaded extension quartet (see the snap description for the full
# CREATE EXTENSION list of everything else this snap ships).
shared_preload_libraries = 'pg_tde,pg_stat_monitor,pgaudit,pg_cron'
cron.database_name = 'postgres'

logging_collector = on
log_directory = '/var/snap/_NAME_/common/log'

hba_file = '/var/snap/_NAME_/current/etc/postgresql/pg_hba.conf'

# WAL archiving to pgbackrest's local repo (see etc/pgbackrest.conf) --
# pgbackrest requires archive_mode on for ANY backup, including a single
# ad-hoc full backup, not just continuous PITR setups. --config is passed
# explicitly (rather than relying on PGBACKREST_CONFIG) because
# archive_command runs as a child of postgres itself, not through the
# pgbackrest app's own environment: stanza.
archive_mode = on
archive_command = 'pgbackrest --config=/var/snap/_NAME_/current/etc/pgbackrest.conf --stanza=main archive-push %p'
