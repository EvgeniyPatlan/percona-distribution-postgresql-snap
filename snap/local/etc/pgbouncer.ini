; PgBouncer configuration for the _NAME_ snap.
; This file is seeded to /var/snap/_NAME_/current/etc/pgbouncer.ini on
; install; edit it there and restart with:
;   sudo snap restart _NAME_.pgbouncer
;
; The pgbouncer daemon is disabled by default (`snap start _NAME_.pgbouncer`).

[databases]
; Example: route "mydb" through the pooler to this snap's own postgres.
; postgres = host=/var/snap/_NAME_/current/run port=5432 dbname=postgres

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/snap/_NAME_/current/run

auth_type = scram-sha-256
auth_file = /var/snap/_NAME_/current/etc/pgbouncer-userlist.txt

; Roles must be created explicitly (createuser + a scram password) and
; added to auth_file before pgbouncer can authenticate them.
admin_users = snap_daemon

pool_mode = session
max_client_conn = 100
default_pool_size = 20

logfile = /var/snap/_NAME_/common/log/pgbouncer.log
pidfile = /var/snap/_NAME_/current/run/pgbouncer.pid
