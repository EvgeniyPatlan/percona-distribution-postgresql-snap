# HAProxy configuration for the _NAME_ snap.
# This file is seeded to /var/snap/_NAME_/current/etc/haproxy.cfg on
# install; edit it there and restart with:
#   sudo snap restart _NAME_.haproxy

global
    maxconn 1024
    stats socket /var/snap/_NAME_/current/run/haproxy.sock mode 660 level admin
    log stderr format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client 1m
    timeout server 1m

# Example postgres frontend/backend. Uncomment and list one "server" line
# per postgres node (this snap's own `postgresql` app listens on 5432).
#
# frontend postgres-front
#     bind *:5000
#     default_backend postgres-back
#
# backend postgres-back
#     option pgsql-check user pgbouncer
#     server node1 127.0.0.1:5432 check
