# PostgreSQL client authentication configuration for the _NAME_ snap.
# This file is seeded to /var/snap/_NAME_/current/etc/postgresql/pg_hba.conf
# on install; edit it there and restart with:
#   sudo snap restart _NAME_.postgresql
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Every client wrapper in this snap (psql, pg_dump, ...) drops privileges
# to the snap_daemon system user before connecting over the local socket,
# so peer auth alone makes it the postgres superuser with no password:
local   all             all                                     peer

# Host (TCP) connections need an explicitly created role with a password;
# scram-sha-256 is required rather than trust/md5.
host    all             all             127.0.0.1/32            scram-sha-256
