# Pgpool-II configuration for the _NAME_ snap.
# This file is seeded to /var/snap/_NAME_/current/etc/pgpool.conf on
# install; edit it there and restart with:
#   sudo snap restart _NAME_.pgpool

listen_addresses = '127.0.0.1'
port = 9999
# NOTE: pgpool's directive is unix_socket_directories (plural, matching
# postgres's own name) -- "socket_dir" is not a real pgpool.conf key and
# is silently ignored, leaving the frontend socket at pgpool's compiled-in
# default (/tmp) instead of this path. Verified against a real build.
unix_socket_directories = '/var/snap/_NAME_/current/run'

pcp_listen_addresses = '127.0.0.1'
pcp_port = 9898
pcp_socket_dir = '/var/snap/_NAME_/current/run'

# Single backend: this snap's own postgres daemon.
backend_hostname0 = '127.0.0.1'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/var/snap/_NAME_/common/data'
backend_flag0 = 'ALLOW_TO_FAILOVER'

# sr_check_user/health_check_user are UNSET by default -- pgpool needs a
# real, authenticated backend connection to find the primary node and run
# health checks, same as any other role (see pg_hba.conf: the "host"
# line requires scram-sha-256, so peer/trust auth does not apply here).
# Without these, pgpool degrades: it eventually gives up waiting for a
# primary and its main process exits while workers linger. Configure
# after createuser + a scram password, e.g.:
#   sr_check_user = 'myrole'
#   sr_check_password = 'mypassword'
#   health_check_user = 'myrole'
#   health_check_password = 'mypassword'
# For CLIENT connections to be proxied through, pgpool ALSO needs its own
# copy of each role's credentials in pool_passwd (separate from the
# client-supplied password) -- generate with:
#   PGPOOLKEYFILE=/var/snap/_NAME_/common/pgpool.key usr/sbin/pg_enc -m \
#     -u myrole -f /var/snap/_NAME_/current/etc/pgpool.conf mypassword
# (pg_enc's AES storage is required, not pg_md5's plain md5 form, because
# the backend requires scram-sha-256, not md5.)

log_min_messages = warning
logdir = '/var/snap/_NAME_/common/log'
pid_file_name = '/var/snap/_NAME_/current/run/pgpool.pid'
