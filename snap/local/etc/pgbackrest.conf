# pgBackRest configuration for the _NAME_ snap.
# This file is seeded to /var/snap/_NAME_/current/etc/pgbackrest.conf on
# install; edit it there. The `pgbackrest` app reads it by default (see
# PGBACKREST_CONFIG in snapcraft.yaml), so --config is not required.

[global]
repo1-path=/var/snap/_NAME_/common/pgbackrest
# pgbackrest's own compiled-in default log-path (/var/log/pgbackrest) is
# outside the snap and unwritable under strict confinement -- point it at
# the same common/log directory postgres itself logs to (created/chowned
# by the install hook already).
log-path=/var/snap/_NAME_/common/log

[global:restore]
# Belt-and-braces for the postgresql app's PGBACKREST_CONFIG environment
# (snap/snapcraft.yaml): `pgbackrest restore` writes restore_command into
# postgresql.auto.conf using its own running binary's path, which -- if
# invoked from a revision-pinned mount point -- would pin restore_command
# to that specific revision (broken on the next refresh). Force the
# current-based paths explicitly instead, so recovery never depends on
# either the environment variable being plumbed through correctly OR the
# revision pgbackrest restore happened to be run from.
recovery-option=restore_command=/snap/_NAME_/current/usr/bin/pgbackrest --config=/var/snap/_NAME_/current/etc/pgbackrest.conf --stanza=main archive-get %f "%p"

[main]
pg1-path=/var/snap/_NAME_/common/data
pg1-socket-path=/var/snap/_NAME_/current/run
